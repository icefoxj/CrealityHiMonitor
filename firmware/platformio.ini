; CrealityHiMonitor (HM-01) firmware - M5Stack AtomS3R or M5Stack CoreS3 (ESP32-S3)
;
;   pio run -e atoms3r                build for the AtomS3R (round HUD that turns)
;   pio run -e cores3                 build for the CoreS3 (320x240 dashboard)
;   pio run -e <env> -t upload        flash over USB-C
;   pio device monitor                serial console 115200 (type "help")
;   pio test -e native                unit tests of lib/hm_core on the host (needs gcc)

[platformio]
default_envs = atoms3r

; What both boards share
[esp32s3]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
    -std=gnu++11
    -Os
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=1
build_src_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
lib_deps =
    m5stack/M5GFX@0.2.33
    m5stack/M5Unified@0.2.26
    tzapu/WiFiManager@2.0.17
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.4.2

[env:atoms3r]
extends = esp32s3
board = m5stack-atoms3
board_build.partitions = default_8MB.csv
build_flags =
    ${esp32s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:cores3]
extends = esp32s3
board = m5stack-cores3
board_build.partitions = default_16MB.csv
build_flags =
    ${esp32s3.build_flags}
    -DHM_BOARD_CORES3

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -Wall
lib_deps =
    bblanchon/ArduinoJson@7.4.2
lib_compat_mode = off
test_build_src = no
