name: Release

# A version tag (vX.Y.Z) reruns the firmware workflow (tests + build), then
# publishes a GitHub release with the firmware images. The notes are the
# tag's section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  publish:
    needs: [firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # By name: the files land straight in dist/. Without a name, v8 put a
      # lone artifact in dist/ too, not in dist/<name>/, and v0.1.0 went out
      # with no binaries.
      - uses: actions/download-artifact@v8
        with:
          name: CrealityHiMonitor-firmware
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: CrealityHiMonitor-cardputerzero
          path: dist
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          awk -v v="$ver" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]*\]: / { exit }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $ver" >&2
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ### Downloads

          | File | Contents |
          |---|---|
          | `CrealityHiMonitor-atoms3r-merged.bin` | firmware for the M5Stack AtomS3R (round HUD), full image: write it at `0x0` |
          | `CrealityHiMonitor-atoms3r-app.bin` | AtomS3R, the application only: write it at `0x10000` over an existing install (keeps the settings) |
          | `CrealityHiMonitor-cores3-merged.bin` | firmware for the M5Stack CoreS3 (320 x 240 dashboard), full image: write it at `0x0` |
          | `CrealityHiMonitor-cores3-app.bin` | CoreS3, the application only: write it at `0x10000` |
          | `hm01-hi-monitor_<ver>_arm64.deb` | the M5Stack CardputerZero app (Debian arm64): adds HM-01 to its launcher menu |

          Flash: `esptool.py --chip esp32s3 write_flash 0x0 CrealityHiMonitor-<board>-merged.bin`

          CardputerZero: copy the `.deb` to the device and run `sudo dpkg -i hm01-hi-monitor_<ver>_arm64.deb`.
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          name: CrealityHiMonitor ${{ steps.notes.outputs.ver }}
          body_path: notes.md
          files: |
            dist/*.bin
            dist/*.deb
          fail_on_unmatched_files: true
